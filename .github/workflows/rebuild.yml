name: Paper rebuild
on:
  push:
    branches: [paper-rebuild-20261001]
    paths: ['.github/workflows/rebuild.yml', 'reproduction/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf pandas openpyxl
      - name: Fetch primary sources and extract cleaning passages
        run: |
          mkdir -p source_check
          python - <<'PY'
          import requests, pathlib, json, hashlib, fitz, re, pandas as pd
          out=pathlib.Path('source_check'); manifest=[]
          urls={
          'AIPT_2024':'https://www.nber.org/system/files/working_papers/w33012/revisions/w33012.rev0.pdf',
          'AIPT_current':'https://www.nber.org/system/files/working_papers/w33012/w33012.pdf',
          'factor_details':'https://raw.githubusercontent.com/bkelly-lab/ReplicationCrisis/master/GlobalFactors/Factor%20Details.xlsx',
          'JKMP_main':'https://raw.githubusercontent.com/theisij/ml-and-the-implementable-efficient-frontier/13d836b5187cbfa69730dd256d8eb767e65ca21f/Main.R',
          'JKMP_prepare':'https://raw.githubusercontent.com/theisij/ml-and-the-implementable-efficient-frontier/13d836b5187cbfa69730dd256d8eb767e65ca21f/1%20-%20Prepare%20Data.R'
          }
          for name,url in urls.items():
              try:
                  r=requests.get(url,timeout=60)
                  info={'name':name,'url':url,'status':r.status_code,'bytes':len(r.content)}
                  if r.ok:
                      info['sha256']=hashlib.sha256(r.content).hexdigest()
                      if r.content.startswith(b'%PDF'):
                          (out/(name+'.pdf')).write_bytes(r.content)
                          doc=fitz.open(stream=r.content,filetype='pdf')
                          text='\n'.join('[PAGE %d]\n%s'%(i+1,p.get_text()) for i,p in enumerate(doc))
                          (out/(name+'.txt')).write_text(text)
                          for term in ['130','132','missing','nano','characteristics']:
                              for match in list(re.finditer(term,text,re.I))[:4]:
                                  print(name,term,repr(text[max(0,match.start()-250):match.end()+750]))
                      elif name=='factor_details':
                          (out/'factor_details.xlsx').write_bytes(r.content)
                          d=pd.read_excel(out/'factor_details.xlsx')
                          chars=d.loc[d.abr_jkp.notna(),'abr_jkp'].drop_duplicates().tolist()
                          (out/'candidate_characteristics.json').write_text(json.dumps(chars,indent=2))
                          print('Published characteristic names:',len(chars))
                      else:
                          (out/(name+'.txt')).write_text(r.text)
                  manifest.append(info)
              except Exception as e:
                  manifest.append({'name':name,'error':type(e).__name__})
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-rebuild-source-check
          path: source_check/
          retention-days: 90
          if-no-files-found: error
