name: Export portable audit tables
on:
  push:
    branches: [empirics-audit-20260924]
    paths: [.github/workflows/export_audit_csv.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow
      - uses: actions/download-artifact@v4
        with:
          name: empirical-audit-inputs
          path: inputs
          github-token: ${{ github.token }}
          run-id: '35963890506'
      - run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path('inputs'); out=Path('csv_tables'); out.mkdir()
          count=0
          for src in root.rglob('*.parquet'):
              rel=src.relative_to(root).with_suffix('.csv.gz')
              dst=out/rel; dst.parent.mkdir(parents=True,exist_ok=True)
              df=pd.read_parquet(src); df.to_csv(dst,index=False,compression='gzip')
              count+=1
          print('Converted tables:',count)
          print('Compressed bytes:',sum(p.stat().st_size for p in out.rglob('*') if p.is_file()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: empirical-audit-csv
          path: csv_tables/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
