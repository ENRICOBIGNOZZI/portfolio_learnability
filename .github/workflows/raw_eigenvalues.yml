name: Raw eigenvalue plots

on:
  push:
    branches:
      - raw-eigenvalue-plots-20260920
    paths:
      - raw_eigenvalues_all.py
      - .github/workflows/raw_eigenvalues.yml

permissions:
  contents: read

jobs:
  spectra:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow matplotlib scipy scikit-learn openpyxl wrds psycopg2-binary

      - name: Generate exact raw spectra
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python raw_eigenvalues_all.py

      - name: Upload spectra
        uses: actions/upload-artifact@v4
        with:
          name: raw-eigenvalue-plots
          path: results/raw_eigenvalues/
          retention-days: 7
