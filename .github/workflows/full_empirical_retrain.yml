name: Full uncapped 2000-feature empirical retrain

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - empirics-uncapped-20260923
    paths:
      - .github/workflows/full_empirical_retrain.yml

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  OPENBLAS_NUM_THREADS: "4"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  NUMEXPR_NUM_THREADS: "4"

jobs:
  prepare-data:
    name: Prepare licensed JKP data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WRDS_USERNAME: ${{ secrets.WRDS_USERNAME }}
      WRDS_PASSWORD: ${{ secrets.WRDS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify WRDS secrets are configured
        shell: bash
        run: |
          test -n "$WRDS_USERNAME" || (echo "WRDS_USERNAME repository secret is missing" >&2; exit 2)
          test -n "$WRDS_PASSWORD" || (echo "WRDS_PASSWORD repository secret is missing" >&2; exit 2)

      - name: Configure non-interactive WRDS libpq credentials
        shell: bash
        run: |
          mkdir -p "$HOME"
          printf 'wrds-pgdata.wharton.upenn.edu:9737:wrds:%s:%s\n' "$WRDS_USERNAME" "$WRDS_PASSWORD" > "$HOME/.pgpass"
          chmod 600 "$HOME/.pgpass"
          echo "PGPASSFILE=$HOME/.pgpass" >> "$GITHUB_ENV"

      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow openpyxl sqlalchemy psycopg2-binary

      - name: Download paper sample from WRDS
        run: python download_JKP/dataset.py

      - name: Build and verify clean 1963-2024 cache
        run: |
          python - <<'PY'
          from download_JKP.read_dataset import DEFAULT_DATA_DIR, available_jkp_characteristics, available_jkp_years
          chars = available_jkp_characteristics(DEFAULT_DATA_DIR)
          years = available_jkp_years(DEFAULT_DATA_DIR)
          assert len(chars) == 132, len(chars)
          assert years[0] == 1963 and years[-1] == 2024, (years[0], years[-1])
          print("Verified:", len(chars), "characteristics,", len(years), "years")
          PY

      - name: Package licensed data for this workflow only
        shell: bash
        run: |
          tar -cf - data/JKP_USA data/JKP_USA_clean \
            | zstd -T0 -6 \
            | openssl enc -aes-256-cbc -pbkdf2 -salt \
                -pass env:WRDS_PASSWORD \
                -out jkp_data.tar.zst.enc
          rm -rf data/JKP_USA data/JKP_USA_clean

      - name: Upload encrypted ephemeral data bundle
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-jkp-data
          path: jkp_data.tar.zst.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  train:
    name: Train ${{ matrix.kernel }} seed ${{ matrix.seed }}
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 420
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - kernel: linear
            seed: 0
          - kernel: gaussian
            seed: 0
          - kernel: gaussian
            seed: 1
          - kernel: ntk
            seed: 0
          - kernel: ntk
            seed: 1
          - kernel: matern12
            seed: 0
          - kernel: matern12
            seed: 1
          - kernel: matern32
            seed: 0
          - kernel: matern32
            seed: 1
          - kernel: matern52
            seed: 0
          - kernel: matern52
            seed: 1
    env:
      WRDS_PASSWORD: ${{ secrets.WRDS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scipy matplotlib scikit-learn plotly

      - name: Download encrypted data
        uses: actions/download-artifact@v4
        with:
          name: encrypted-jkp-data
          path: .data_artifact

      - name: Decrypt data into ephemeral runner
        shell: bash
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:WRDS_PASSWORD \
            -in .data_artifact/jkp_data.tar.zst.enc \
            | zstd -d \
            | tar -xf -
          test -f data/JKP_USA_clean/cleaning_manifest.json

      - name: Full chronological uncapped training and tuning
        run: python main.py --characteristics all --kernels "${{ matrix.kernel }}" --seed "${{ matrix.seed }}"

      - name: Package kernel result tree
        if: always()
        shell: bash
        run: |
          if [ -d "results/${{ matrix.kernel }}/all" ]; then
            tar -czf "kernel-${{ matrix.kernel }}-seed${{ matrix.seed }}.tar.gz" "results/${{ matrix.kernel }}/all"
          fi

      - name: Upload kernel results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.kernel }}-seed${{ matrix.seed }}
          path: kernel-${{ matrix.kernel }}-seed${{ matrix.seed }}.tar.gz
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

  aggregate:
    name: Rebuild clean uncapped empirical package
    needs: train
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      WRDS_PASSWORD: ${{ secrets.WRDS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scipy matplotlib scikit-learn plotly

      - name: Download all seed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-*-seed*
          path: .kernel_artifacts
          merge-multiple: true

      - name: Restore kernel result trees
        shell: bash
        run: |
          shopt -s nullglob
          files=(.kernel_artifacts/kernel-*-seed*.tar.gz)
          test "${#files[@]}" -eq 11 || (echo "Expected 11 completed seed artifacts, found ${#files[@]}" >&2; exit 3)
          for file in "${files[@]}"; do
            tar -xzf "$file"
          done

      - name: Download encrypted data
        uses: actions/download-artifact@v4
        with:
          name: encrypted-jkp-data
          path: .data_artifact

      - name: Decrypt data for expanding-window diagnostics
        shell: bash
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:WRDS_PASSWORD \
            -in .data_artifact/jkp_data.tar.zst.enc \
            | zstd -d \
            | tar -xf -

      - name: Rebuild seed-0 equity comparison
        run: python equities.py --characteristics all

      - name: Rebuild spectra and b files
        run: python eigenvalues.py --characteristics all

      - name: Rebuild effective-complexity analysis
        run: python complexity_analysis.py --characteristics all

      - name: Rebuild raw paper spectra
        run: python final_spectra.py

      - name: Run Gaussian expanding-window 1/T experiment
        run: python expanding_window_gaussian.py --characteristics all

      - name: Run Matérn expanding-window spectrum-rate experiments
        run: python expanding_window_matern.py --characteristics all

      - name: Compare the two finite-feature seeds
        run: python seed_stability.py

      - name: Build lambda, complexity, return and drawdown diagnostics
        run: python learnability_diagnostics.py

      - name: Write compact uncapped numerical summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root = Path("results")
          rows = []
          for kernel in ["linear","gaussian","ntk","matern12","matern32","matern52"]:
              d = pd.read_parquet(root / kernel / "all" / "portfolio_returns.parquet").sort_values("return_date")
              r = d["raw_portfolio_return"]
              rows.append({
                  "kernel": kernel,
                  "months": len(r),
                  "mean_ann": 12*r.mean(),
                  "vol_ann": (12**0.5)*r.std(ddof=1),
                  "sharpe": (12**0.5)*r.mean()/r.std(ddof=1),
                  "quadratic_criterion": ((1-r)**2).mean(),
                  "median_gross": d["gross_exposure"].median(),
                  "p95_gross": d["gross_exposure"].quantile(.95),
                  "p99_gross": d["gross_exposure"].quantile(.99),
                  "max_gross": d["gross_exposure"].max(),
                  "max_abs_weight": d["max_abs_weight"].max(),
              })
          summary = pd.DataFrame(rows)
          summary.to_csv(root / "final_uncapped_performance_summary.csv", index=False)
          print(summary.to_string(index=False))

          print("\nTwo-seed stability")
          print(pd.read_csv(root / "seed_stability" / "seed_performance.csv").to_string(index=False))

          print("\nGaussian annual-retuning versus inverse-history rule")
          print(pd.read_csv(root / "learnability_diagnostics" / "rule_summary.csv").to_string(index=False))
          print(pd.read_csv(root / "learnability_diagnostics" / "hyperoptimized_vs_rate_bootstrap_summary.csv").to_string(index=False))
          PY

      - name: Upload complete clean uncapped research outputs
        uses: actions/upload-artifact@v4
        with:
          name: paper-results-uncapped-2000
          path: results/
          retention-days: 90
          compression-level: 3
          if-no-files-found: error
