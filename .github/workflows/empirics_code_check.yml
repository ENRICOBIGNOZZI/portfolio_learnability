name: Empirics code check

on:
  push:
    branches:
      - empirics-expanding-clean-20260920
    paths:
      - expanding_window_gaussian.py
      - final_spectra.py
      - test_expanding_window_gaussian.py
      - test_ntk_feature_dimension.py
      - .github/workflows/empirics_code_check.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib pyarrow scipy scikit-learn pytest

      - name: Compile empirical scripts
        run: |
          python -m py_compile expanding_window_gaussian.py final_spectra.py

      - name: Run synthetic tests
        run: pytest -q test_expanding_window_gaussian.py test_ntk_feature_dimension.py
