name: Reproduce portfolio paper
on:
  push:
    branches: [main, paper-rebuild-20261001]
    paths: ['*.py', 'tests/**', 'requirements.txt', 'characteristics.json', '.github/workflows/paper.yml']
  workflow_dispatch:
    inputs:
      authorize_new_wrds_connection:
        description: 'Explicitly authorize ONE new WRDS authentication; no automatic retry'
        type: boolean
        default: false
      raw_run_id:
        description: 'Existing run with paper-raw-jkp-encrypted; ignored for a new download'
        type: string
        default: '36896896876'
permissions:
  contents: read
  actions: read
concurrency:
  group: portfolio-paper-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile and run only the new tests
        run: |
          python -m compileall -q download.py data.py model.py run.py figures.py tests
          python -m pytest -q tests --junitxml=test_results.xml
      - name: Package only the new source, never old files or credentials
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile, json, hashlib, os
          paths=['download.py','data.py','model.py','run.py','figures.py','requirements.txt',
                 'characteristics.json','README.md','tests/test_pipeline.py','.github/workflows/paper.yml']
          manifest={'git_sha':os.environ['GITHUB_SHA'],'files':{}}
          with zipfile.ZipFile('paper_reproduction_source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  p=Path(name)
                  if p.exists():
                      z.write(p,'paper_reproduction/'+name)
                      manifest['files'][name]=hashlib.sha256(p.read_bytes()).hexdigest()
              z.writestr('paper_reproduction/source_manifest.json',json.dumps(manifest,indent=2))
          Path('source_manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-reproduction-source-and-tests
          path: |
            paper_reproduction_source.zip
            source_manifest.json
            test_results.xml
          retention-days: 90
  data:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: paper-wrds-single-request
      cancel-in-progress: false
    env:
      WRDS_USERNAME: ${{ secrets.WRDS_USERNAME }}
      WRDS_PASSWORD: ${{ secrets.WRDS_PASSWORD }}
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Reuse encrypted raw snapshot without contacting WRDS
        if: ${{ !inputs.authorize_new_wrds_connection }}
        uses: actions/download-artifact@v4
        with:
          name: paper-raw-jkp-encrypted
          run-id: ${{ inputs.raw_run_id }}
          github-token: ${{ github.token }}
          path: encrypted_input
      - name: Decrypt existing snapshot
        if: ${{ !inputs.authorize_new_wrds_connection }}
        run: |
          test -n "$WRDS_PASSWORD"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:WRDS_PASSWORD -in encrypted_input/raw_jkp.tar.gz.enc | tar -xzf -
          test -f data/raw/manifest.json
      - name: One explicitly authorized connection
        if: ${{ inputs.authorize_new_wrds_connection }}
        run: python -u download.py --names characteristics.json --out data/raw
      - name: Clean from the raw snapshot
        run: |
          python -u run.py prepare --raw data/raw --clean data/clean
          python -c "import json; m=json.load(open('data/clean/manifest.json')); assert m['status']=='complete', 'Unresolved stock returns require documented reconciliation'"
          python run.py risk-free --out data/risk_free.csv
      - name: Preserve raw input and preparation diagnostics encrypted
        if: always()
        run: |
          mkdir -p status
          test ! -f data/raw/connection_attempt.json || cp data/raw/connection_attempt.json status/
          test ! -f data/raw/manifest.json || cp data/raw/manifest.json status/raw_manifest.json
          test ! -f data/clean/manifest.json || cp data/clean/manifest.json status/clean_manifest.json
          if [ -d data/raw ] && [ -n "$WRDS_PASSWORD" ]; then
            tar -czf - data/raw | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:WRDS_PASSWORD -out raw_jkp.tar.gz.enc
          fi
          if [ -f data/clean/manifest.json ] && [ -n "$WRDS_PASSWORD" ]; then
            tar -czf - data/clean data/risk_free* 2>/dev/null | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:WRDS_PASSWORD -out clean_jkp.tar.gz.enc
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-raw-jkp-encrypted
          path: raw_jkp.tar.gz.enc
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-clean-jkp-encrypted
          path: clean_jkp.tar.gz.enc
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-data-status
          path: status/
          retention-days: 90
          if-no-files-found: warn
  fit:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        kernel: [linear, gaussian, matern32]
    env:
      WRDS_PASSWORD: ${{ secrets.WRDS_PASSWORD }}
      OPENBLAS_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: paper-clean-jkp-encrypted
      - run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:WRDS_PASSWORD -in clean_jkp.tar.gz.enc | tar -xzf -
      - name: Refit every annual window and every requested RFF count
        run: python -u run.py fit --clean data/clean --out results/new --kernel ${{ matrix.kernel }}
      - uses: actions/upload-artifact@v4
        with:
          name: paper-new-results-${{ matrix.kernel }}
          path: results/new/public/
          retention-days: 90
      - name: Encrypt security weights and fitted coefficients
        run: tar -czf - results/new/private | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:WRDS_PASSWORD -out private_results.enc
      - uses: actions/upload-artifact@v4
        with:
          name: paper-private-${{ matrix.kernel }}-encrypted
          path: private_results.enc
          compression-level: 0
          retention-days: 90
  report:
    needs: fit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WRDS_PASSWORD: ${{ secrets.WRDS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: paper-new-results-*
          merge-multiple: true
          path: results/new/public
      - uses: actions/download-artifact@v4
        with:
          name: paper-clean-jkp-encrypted
      - run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:WRDS_PASSWORD -in clean_jkp.tar.gz.enc | tar -xzf -
      - run: python run.py report --results results/new --risk-free data/risk_free.csv --out paper
      - name: Compile the empirical section
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra
          cd paper
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          if grep -E 'undefined references|undefined citations' main.log; then exit 1; fi
      - name: Publish only requested deliverables
        run: |
          find paper -type f \( -name '*.aux' -o -name '*.log' -o -name '*.out' -o -name '*.blg' \) -delete
          python - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('new_paper_empirics.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in pathlib.Path('paper').rglob('*'):
                  if p.is_file(): z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-new-empirics-figures-pdf
          path: |
            new_paper_empirics.zip
            paper/
          retention-days: 90
