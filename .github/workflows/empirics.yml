name: Final empirical protocol
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Verify final source scope
        run: |
          python -m compileall -q data_pipeline.py download.py kernels.py portfolio.py run_empirics.py figures.py complexity_schedule.py audit_schedule_grid.py
          test ! -d archive
          test ! -d legacy
