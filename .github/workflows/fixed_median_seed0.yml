name: Fixed median seed-0 2k/4k empirical retrain

on:
  workflow_dispatch:
  push:
    branches:
      - empirics-fixed-median-seed0-20260924
    paths:
      - .github/workflows/fixed_median_seed0.yml
      - main.py
      - train_model.py
      - spectral_lambda_experiment.py
      - Kernels/**
      - median_lengthscale.py
      - Utils/**
      - download_JKP/**

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  OPENBLAS_NUM_THREADS: "4"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  NUMEXPR_NUM_THREADS: "4"

jobs:
  prepare-data:
    name: Prepare licensed JKP data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WRDS_USERNAME: ${{ secrets.WRDS_USERNAME }}
      WRDS_PASSWORD: ${{ secrets.WRDS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify WRDS secrets
        shell: bash
        run: |
          test -n "$WRDS_USERNAME" || (echo "WRDS_USERNAME is missing" >&2; exit 2)
          test -n "$WRDS_PASSWORD" || (echo "WRDS_PASSWORD is missing" >&2; exit 2)

      - name: Configure WRDS libpq credentials
        shell: bash
        run: |
          mkdir -p "$HOME"
          printf 'wrds-pgdata.wharton.upenn.edu:9737:wrds:%s:%s\n' "$WRDS_USERNAME" "$WRDS_PASSWORD" > "$HOME/.pgpass"
          chmod 600 "$HOME/.pgpass"
          echo "PGPASSFILE=$HOME/.pgpass" >> "$GITHUB_ENV"

      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow openpyxl sqlalchemy psycopg2-binary

      - name: Download paper sample
        run: python download_JKP/dataset.py

      - name: Verify sample
        run: |
          python - <<'PY'
          from download_JKP.read_dataset import DEFAULT_DATA_DIR, available_jkp_characteristics, available_jkp_years
          chars = available_jkp_characteristics(DEFAULT_DATA_DIR)
          years = available_jkp_years(DEFAULT_DATA_DIR)
          assert len(chars) == 132, len(chars)
          assert years[0] == 1963 and years[-1] == 2024, (years[0], years[-1])
          print("Verified:", len(chars), "characteristics,", years[0], "-", years[-1])
          PY

      - name: Package encrypted ephemeral data
        shell: bash
        run: |
          tar -cf - data/JKP_USA data/JKP_USA_clean \
            | zstd -T0 -6 \
            | openssl enc -aes-256-cbc -pbkdf2 -salt \
                -pass env:WRDS_PASSWORD \
                -out jkp_data.tar.zst.enc
          rm -rf data/JKP_USA data/JKP_USA_clean

      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-jkp-data
          path: jkp_data.tar.zst.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  train:
    name: ${{ matrix.kernel }} / ${{ matrix.features }} features / seed 0 / median ell
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 420
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {kernel: linear, features: 2000}
          - {kernel: gaussian, features: 2000}
          - {kernel: gaussian, features: 4000}
          - {kernel: ntk, features: 2000}
          - {kernel: ntk, features: 4000}
          - {kernel: matern12, features: 2000}
          - {kernel: matern12, features: 4000}
          - {kernel: matern32, features: 2000}
          - {kernel: matern32, features: 4000}
          - {kernel: matern52, features: 2000}
          - {kernel: matern52, features: 4000}

    env:
      WRDS_PASSWORD: ${{ secrets.WRDS_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scipy matplotlib scikit-learn plotly

      - uses: actions/download-artifact@v4
        with:
          name: encrypted-jkp-data
          path: .data_artifact

      - name: Decrypt data
        shell: bash
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:WRDS_PASSWORD \
            -in .data_artifact/jkp_data.tar.zst.enc \
            | zstd -d \
            | tar -xf -

      - name: Train with annual cross-validated lambda
        run: |
          python main.py \
            --characteristics all \
            --kernels "${{ matrix.kernel }}" \
            --seed 0 \
            --n-random-features "${{ matrix.features }}" \
            --fixed-median-lengthscale

      - name: Package results
        shell: bash
        run: |
          tar -czf "kernel-${{ matrix.kernel }}-${{ matrix.features }}.tar.gz" \
            "results/${{ matrix.kernel }}/all"

      - uses: actions/upload-artifact@v4
        with:
          name: fixed-median-${{ matrix.kernel }}-${{ matrix.features }}
          path: kernel-${{ matrix.kernel }}-${{ matrix.features }}.tar.gz
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

  aggregate:
    name: Compare 2k/4k and run spectral lambda rule
    needs: train
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install numpy pandas pyarrow scipy matplotlib

      - uses: actions/download-artifact@v4
        with:
          pattern: fixed-median-*
          path: .artifacts

      - name: Restore 2k and 4k result trees separately
        shell: bash
        run: |
          mkdir -p restored/2000 restored/4000
          find .artifacts -name 'kernel-*-2000.tar.gz' -print0 | while IFS= read -r -d '' file; do
            tar -xzf "$file" -C restored/2000
          done
          find .artifacts -name 'kernel-*-4000.tar.gz' -print0 | while IFS= read -r -d '' file; do
            tar -xzf "$file" -C restored/4000
          done

      - name: Run spectrum-adaptive lambda experiment
        run: |
          python spectral_lambda_experiment.py \
            --results-root restored/2000/results \
            --rank-min 5 --rank-max 100 \
            --output analysis/2000/spectral_lambda

          python spectral_lambda_experiment.py \
            --results-root restored/4000/results \
            --rank-min 5 --rank-max 100 \
            --output analysis/4000/spectral_lambda

      - name: Build 2k versus 4k summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy.stats import linregress

          kernels = ["linear","gaussian","ntk","matern12","matern32","matern52"]
          rows = []
          spectra = []
          eig = []

          for features in [2000, 4000]:
              root = Path(f"restored/{features}/results")
              for kernel in kernels:
                  folder = root / kernel / "all"
                  if not folder.exists():
                      continue

                  p = pd.read_parquet(folder / "portfolio_returns.parquet").sort_values("return_date")
                  r = 0.1 * p["raw_portfolio_return"].to_numpy(float)
                  wealth = np.cumprod(1.0 + r)
                  dd = wealth / np.maximum.accumulate(wealth) - 1.0

                  rows.append({
                      "features": features,
                      "kernel": kernel,
                      "months": len(r),
                      "mean_ann": 12*np.mean(r),
                      "vol_ann": np.sqrt(12)*np.std(r, ddof=1),
                      "sharpe": np.sqrt(12)*np.mean(r)/np.std(r, ddof=1),
                      "max_drawdown": np.min(dd),
                      "median_gross_c01": 0.1*p["raw_gross_exposure"].median(),
                      "p99_gross_c01": 0.1*p["raw_gross_exposure"].quantile(.99),
                      "lengthscale": p["lengthscale"].iloc[0],
                  })

                  e = pd.read_parquet(folder / "kernel_eigenvalues.parquet")
                  e = e[e["test_year"].eq(2024)].sort_values("eigenvalue_number").copy()
                  e["features"] = features
                  eig.append(e)

                  g = e.loc[
                      e["eigenvalue_number"].between(5,100)
                      & e["eigenvalue"].gt(0)
                  ]
                  fit = linregress(
                      np.log(g["eigenvalue_number"].to_numpy(float)),
                      np.log(g["eigenvalue"].to_numpy(float)),
                  )
                  mu = e.loc[e["eigenvalue"].gt(0), "eigenvalue"].to_numpy(float)
                  total = mu.sum()
                  spectra.append({
                      "features": features,
                      "kernel": kernel,
                      "b_hat_rank5_100": -fit.slope,
                      "b_r2_rank5_100": fit.rvalue**2,
                      "mu1": mu[0],
                      "top1_share": mu[:1].sum()/total,
                      "top10_share": mu[:10].sum()/total,
                      "top50_share": mu[:50].sum()/total,
                  })

          out = Path("analysis")
          out.mkdir(exist_ok=True)
          pd.DataFrame(rows).to_csv(out/"performance_2k_4k.csv", index=False)
          pd.DataFrame(spectra).to_csv(out/"spectrum_2k_4k_2024.csv", index=False)
          pd.concat(eig, ignore_index=True).to_csv(out/"eigenvalues_2k_4k_2024.csv", index=False)

          print("\nPERFORMANCE")
          print(pd.DataFrame(rows).to_string(index=False))
          print("\nSPECTRUM 2024")
          print(pd.DataFrame(spectra).to_string(index=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: fixed-median-seed0-2k-4k-analysis
          path: analysis/
          retention-days: 90
          compression-level: 3
          if-no-files-found: error
