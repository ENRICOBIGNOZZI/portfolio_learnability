name: Rich6D initial sixty-period CV
on:
  workflow_dispatch:
    inputs:
      stage:
        required: true
        type: choice
        options: [pilot, production]
permissions:
  contents: read
concurrency:
  group: rich6d-initial-cv-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  allocation:
    runs-on: ubuntu-24.04
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /simulations/outputs/rich6d_initial_cv60_v1/production_allocation.json
      - id: plan
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          if os.environ['STAGE']=='pilot':
              batches=list(range(12))
          else:
              batches=[r['id'] for r in json.loads(Path('simulations/outputs/rich6d_initial_cv60_v1/production_allocation.json').read_text())['batches']]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('batches='+json.dumps(batches)+'\n')
          PY
  compute:
    needs: allocation
    runs-on: macos-26
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        batch: ${{ fromJSON(needs.allocation.outputs.batches) }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RICH6D_RUNNER_LABEL: macos-26
      RICH6D_EXTENDED_OUTPUT: /tmp/rich6d-cv-inputs
      RICH6D_CV_OUTPUT: /tmp/rich6d-cv-checkpoints
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /kernels.py
            /simulations/*.py
            /simulations/requirements.txt
            /simulations/config/
            /simulations/dgp/
            /simulations/estimator/
            /simulations/experiments/
            /simulations/diagnostics/
            /simulations/extended/
            /simulations/initial_cv/
            /simulations/outputs/rich6d_rough_sr3_annual_monthly_v1/population.json
            /simulations/outputs/rich6d_rough_sr3_extended_v2/protocol.json
            /simulations/outputs/rich6d_rough_sr3_extended_v2/calibration.json
            /simulations/outputs/rich6d_rough_sr3_extended_v2/seed_manifest.json
            /simulations/outputs/rich6d_rough_sr3_extended_v2/remote_input_manifest.json
            /simulations/outputs/rich6d_rough_sr3_extended_v2/population/*_theory.npz
            /simulations/outputs/rich6d_initial_cv60_v1/protocol.json
            /simulations/outputs/rich6d_initial_cv60_v1/reference_manifest.json
            /simulations/outputs/rich6d_initial_cv60_v1/references/
            /simulations/outputs/rich6d_initial_cv60_v1/pilot_gate.json
            /simulations/outputs/rich6d_initial_cv60_v1/production_allocation.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
      - run: python -m pip install -r simulations/requirements.txt
      - name: Execute frozen initial-CV batch
        run: python -u -m simulations.initial_cv.remote --stage ${{ inputs.stage }} --batch ${{ matrix.batch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-cv-${{ inputs.stage }}-${{ matrix.batch }}
          path: /tmp/rich6d-cv-checkpoints/
          if-no-files-found: warn
          retention-days: 7
