name: Paper raw data - one WRDS request
on:
  push:
    branches: [paper-rebuild-20261001]
    paths: ['.github/workflows/acquire.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-wrds-single-request
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WRDS_USERNAME: ${{ secrets.WRDS_USERNAME }}
      WRDS_PASSWORD: ${{ secrets.WRDS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3 pyarrow==19.0.1 psycopg2-binary==2.9.10
      - uses: actions/download-artifact@v4
        with:
          name: paper-rebuild-source-check
          run-id: 36896236165
          github-token: ${{ github.token }}
          path: sources
      - name: Exactly one authenticated data request
        run: python -u download.py --names sources/candidate_characteristics.json --out data/raw
      - name: Encrypt raw cache, including partial files after failure
        if: always()
        shell: bash
        run: |
          mkdir -p status
          test ! -f data/raw/connection_attempt.json || cp data/raw/connection_attempt.json status/
          test ! -f data/raw/manifest.json || cp data/raw/manifest.json status/
          if [ -d data/raw ] && [ -n "$WRDS_PASSWORD" ]; then
            tar -czf - data/raw | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:WRDS_PASSWORD -out raw_jkp.tar.gz.enc
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-raw-data-status
          path: status/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-raw-jkp-encrypted
          path: raw_jkp.tar.gz.enc
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn
